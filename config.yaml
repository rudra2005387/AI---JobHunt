# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  #
  # Gotcha: "sde" as a bare regex does NOT match "Software Development
  # Engineer" — different words entirely. Use \bsde\b for the acronym and
  # list the spelled-out variants separately, as below.

  include_titles:
    # Core software / backend track
    - '\b(software|backend|back-end|server|platform|infrastructure|infra|systems|distributed|cloud)\b.*\bengineer\b'
    - '\bengineer\b.*\b(backend|back-end|platform|infrastructure|infra|systems|distributed|cloud)\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - '\bsoftware development engineer\b'
    - '\bsoftware engineer\b'
    - '\bsite reliability engineer\b'
    - '\bsre\b'
    - '\bmember of technical staff\b'

    # AI / GenAI / LLM track
    - '\b(ai|artificial intelligence)\s+(software\s+)?engineer\b'
    - '\bsoftware engineer\b.*\b(ai|artificial intelligence)\b'
    - '\b(ai|artificial intelligence)\b.*\bengineer\b'
    - '\b(genai|generative ai)\s+(software\s+)?engineer\b'
    - '\bengineer\b.*\b(genai|generative ai)\b'
    - '\b(llm|large language model)\s+engineer\b'
    - '\bengineer\b.*\b(llm|large language model)\b'
    - '\b(applied ai|applied artificial intelligence)\s+engineer\b'
    - '\bai application(s)? engineer\b'
    - '\bmachine learning engineer\b'

    # Systems / networking track
    - '\bnetwork(ing)?\s+(software\s+)?engineer\b'
    - '\b(kernel|embedded|firmware|driver|packet|dataplane|data plane)\b.*\bengineer\b'
    - '\bengineer\b.*\b(kernel|packet|dataplane|data plane|networking|performance)\b'
    - '\bperformance engineer\b'
    - '\bsystems engineer\b'
    - '\bc\+\+\b.*\bengineer\b'
    - '\bengineer\b.*\bc\+\+\b'

  # Anything matching these is dropped even if an include matched.

  # Too senior
  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\bsenior\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'

  # Wrong function
    - '\b(sales|account executive|marketing|recruit|support|success)\b'
    - '\b(frontend|front-end|ios|android|mobile|game|designer)\b'

  # Research-heavy roles
    - '\b(data scientist|machine learning scientist|research scientist)\b'

  # Substrings matched against "<location> <title>", case-insensitive.
  locations:
    - bangalore
    - bengaluru
    - Kolkata
    - Delhi
    - Gurgaon
    - Gurugram
    - Hyderabad
    - Chennai
    - india

  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
  max_age_days: 30

# --- LLM stages -------------------------------------------------------------

screen_batch_size: 8
screen_jd_chars: 1400
draft_jd_chars: 6000
score_threshold: 7.0
max_per_digest: 5

# --- paths ------------------------------------------------------------------

companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv